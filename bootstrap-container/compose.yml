## Dois serviços que se falam pela rede interna do Compose (SEM network_mode: host):
##   kubo:     só o daemon IPFS (imagem oficial)
##   provider: baixa/pina os CIDs do projeto chamando a API do kubo
##
## Subir:  docker compose up -d
## Logs:   docker compose logs -f      (e ./logs/provision.log)
## Parar:  docker compose down         (o repo do IPFS fica no volume ipfs_repo)

name: ipfsbooks

services:
  kubo:
    image: ipfs/kubo:v0.43.1
    restart: unless-stopped
    ports:
      # swarm (libp2p): caminho de entrada para outros peers.
      # Se mudar a porta externa (4008), o Kubo continua anunciando a 4001 interna;
      # tudo bem na LAN, mas para a internet configure Addresses.AppendAnnounce.
      - "4008:4001/tcp"
      - "4008:4001/udp"
      # RPC (admin sem autenticação!) e gateway: SÓ no localhost do host
      - "127.0.0.1:5008:5001"
      - "127.0.0.1:8088:8080"
    volumes:
      - ipfs_repo:/data/ipfs
    healthcheck:
      test: ["CMD-SHELL", "ipfs --api /ip4/127.0.0.1/tcp/5001 id > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  provider:
    image: ipfs/kubo:v0.43.1 # só para ter o binário `ipfs` como cliente da API
    restart: unless-stopped
    depends_on:
      kubo:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/provision.sh"]
    environment:
      IPFS_API: /dns4/kubo/tcp/5001 # "kubo" = nome do serviço, o Compose resolve como DNS
    volumes:
      - ./provision.sh:/provision.sh:ro
      - ./logs:/logs

volumes:
  ipfs_repo: